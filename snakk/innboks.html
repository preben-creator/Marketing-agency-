<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Innboks · KI-sekretær</title><meta name="robots" content="noindex">
<!-- Serveres av workeren orvelo-innboks på /innboks?kunde=<id>&r=<rettekode> (hentes fra GitHub).
     Bedriften ser e-post og Facebook-meldinger med svarforslag fra KI-sekretæren, retter og sender. -->
<style>
:root{--bg:#0f0e17;--card:#1a1928;--ink:#eeedf7;--muted:#a3a0bd;--line:#2e2c44;--acc:#8f78ff;--acc2:#2fd0ee;--ok:#5fd59a;--warn:#ffb547;--field:#13121e;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 80px}
.brand{font-weight:800;letter-spacing:.02em;color:var(--muted);font-size:13px;text-transform:uppercase}
h1{font-size:clamp(24px,5vw,32px);line-height:1.2;margin:6px 0}h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.faner{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.faner button{min-height:38px;padding:6px 12px;font-size:14px}.faner button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#0f0e17}
button,a.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 15px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
button.p{background:var(--acc);border-color:var(--acc);color:#0f0e17}button:disabled{opacity:.5;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.topp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.hvem{font-weight:700;overflow-wrap:anywhere}.tid{color:var(--muted);font-size:13px;white-space:nowrap}
.merke{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
.merke.fb{color:#7fb2ff;border-color:#2c4a7a}.merke.viktig{color:var(--warn);border-color:#6b4f22}.merke.sendt{color:var(--ok);border-color:#2a5a40}
.emne{margin:6px 0 2px;font-weight:600;overflow-wrap:anywhere}.oppsum{color:var(--muted);font-size:14px;margin:2px 0 8px}
details{margin:8px 0}summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:32px}
.orig{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;max-height:320px;overflow:auto;overflow-wrap:anywhere}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-height:150px;resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.sjekk{background:rgba(255,181,71,.08);border:1px solid #6b4f22;border-radius:10px;padding:8px 11px;font-size:14px;margin:8px 0;color:#ffd79a}
.msg{font-size:14px}.ok{color:var(--ok)}.err{color:var(--warn)}
.tom{color:var(--muted);text-align:center;padding:30px 10px}
.info{font-size:14px;color:var(--muted)}.info code{background:var(--field);padding:2px 6px;border-radius:6px;color:var(--ink);word-break:break-all}
</style></head><body><div class="wrap">
<div class="brand">Orvelo · KI-sekretær</div>
<h1>Innboks for <span id="firma">bedriften</span></h1>
<p class="lead">Her ser du e-post og Facebook-meldinger som har kommet inn, med et forslag til svar fra sekretæren. Les, rett om nødvendig, og trykk «Send». Ingenting sendes før du trykker.</p>
<div class="faner" role="group" aria-label="Vis">
  <button type="button" data-f="ny" aria-pressed="true">Trenger svar</button>
  <button type="button" data-f="ferdig" aria-pressed="false">Ferdige</button>
  <button type="button" data-f="andre" aria-pressed="false">Reklame og varsler</button>
  <button type="button" id="oppdater">Oppdater</button>
</div>
<div id="liste"><div class="card">Henter meldinger …</div></div>
<p class="info" id="info"></p>
</div>
<script>
const q=new URLSearchParams(location.search);const KUNDE=q.get("kunde")||"",R=q.get("r")||"";
const $=i=>document.getElementById(i);let DATA=null,FILTER="ny";
const fmt=ms=>new Date(ms).toLocaleString("nb-NO",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
async function api(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({kunde:KUNDE,r:R},b))});const d=await r.json().catch(()=>({feil:"Ugyldig svar fra tjenesten"}));if(!r.ok||d.feil)throw new Error(d.feil||("Feil "+r.status));return d;}
async function last(){
  try{const r=await fetch("/innboks/data?kunde="+encodeURIComponent(KUNDE)+"&r="+encodeURIComponent(R));DATA=await r.json();if(!r.ok||DATA.feil)throw new Error(DATA.feil||r.status);}
  catch(e){$("liste").innerHTML="";const c=el("div","card err",e.message);$("liste").appendChild(c);return;}
  $("firma").textContent=DATA.firma;
  $("info").innerHTML="";
  if(DATA.adresse){$("info").append("E-post kommer hit når den videresendes til ");const c=el("code","",DATA.adresse);$("info").append(c,". Meldinger slettes automatisk etter 30 dager.");}
  tegn();
}
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
function passer(m){if(FILTER==="ny")return m.status==="ny"&&(m.kategori==="kunde"||m.kategori==="bekreftelse");if(FILTER==="ferdig")return m.status==="sendt"||m.status==="ferdig";return m.kategori!=="kunde"&&m.kategori!=="bekreftelse"||m.status==="ikke svar";}
function tegn(){
  const L=$("liste");L.innerHTML="";const ms=(DATA.meldinger||[]).filter(passer);
  if(!ms.length){L.appendChild(el("div","card tom",FILTER==="ny"?"Ingen meldinger som venter på svar. 🎉":"Ingenting her."));return;}
  ms.forEach(m=>L.appendChild(kort(m)));
}
function kort(m){
  const c=el("article","card");const topp=el("div","topp");const v=el("div");
  v.appendChild(el("span","merke"+(m.kanal==="facebook"?" fb":""),m.kanal==="facebook"?"Facebook":"E-post"));
  if(m.haster)v.appendChild(el("span","merke viktig","Viktig"));
  if(m.status==="sendt")v.appendChild(el("span","merke sendt",m.sendt&&m.sendt.av==="auto"?"Sendt automatisk":"Sendt"));
  if(m.status==="ferdig")v.appendChild(el("span","merke sendt","Ferdig"));
  if(m.kategori!=="kunde"&&m.kategori!=="bekreftelse")v.appendChild(el("span","merke",m.kategori));
  v.appendChild(el("span","hvem",(m.navn||m.epost||"Ukjent")+(m.navn&&m.epost?" <"+m.epost+">":"")));
  topp.append(v,el("span","tid",fmt(m.tid)));c.appendChild(topp);
  if(m.emne)c.appendChild(el("div","emne",m.emne));
  if(m.oppsummering)c.appendChild(el("div","oppsum",m.oppsummering));
  const d=el("details");d.appendChild(el("summary","",m.kategori==="bekreftelse"?"Vis e-posten fra Gmail":"Vis meldingen"));d.appendChild(el("div","orig",m.tekst||""));c.appendChild(d);
  if(m.kategori==="bekreftelse"){d.open=true;c.appendChild(el("p","info","Gmail ber om å bekrefte videresendingen. Åpne lenken i e-posten over (eller bruk koden i Gmail-innstillingene), og trykk så «Ferdig»."));}
  if(m.status==="sendt"&&m.sendt){c.appendChild(el("div","orig",m.sendt.tekst));return c;}
  const msg=el("span","msg");
  if(m.kategori==="kunde"&&m.status==="ny"){
    if(m.mangler&&m.mangler.length)c.appendChild(el("div","sjekk","Sjekk før du sender: "+m.mangler.join(" · ")));
    const ta=el("textarea");ta.value=m.forslag||"";ta.setAttribute("aria-label","Svar til "+(m.navn||"kunden"));c.appendChild(ta);
    const rad=el("div","row");rad.style.marginTop="10px";
    const kanSende=m.kanSende&&(m.kanal==="facebook"?DATA.facebook:DATA.kanSendeEpost);
    if(kanSende){const s=el("button","p","Send");s.type="button";s.onclick=async()=>{if(!ta.value.trim())return;s.disabled=true;msg.className="msg";msg.textContent="Sender …";
      try{await api("/innboks/send",{id:m.id,tekst:ta.value});m.status="sendt";m.sendt={tekst:ta.value,av:"bedriften"};msg.className="msg ok";msg.textContent="Sendt ✓";setTimeout(tegn,900);}
      catch(e){s.disabled=false;msg.className="msg err";msg.textContent=e.message;}};rad.appendChild(s);}
    if(m.kanal==="epost"&&m.epost){const a=el("a","btn","Åpne i e-post");a.href="mailto:"+encodeURIComponent(m.epost)+"?subject="+encodeURIComponent(m.emne?(/^(re|sv)\s*:/i.test(m.emne)?m.emne:"Sv: "+m.emne):"Svar")+"&body="+encodeURIComponent(ta.value);
      a.onclick=()=>{a.href="mailto:"+encodeURIComponent(m.epost)+"?subject="+encodeURIComponent(m.emne?(/^(re|sv)\s*:/i.test(m.emne)?m.emne:"Sv: "+m.emne):"Svar")+"&body="+encodeURIComponent(ta.value);};rad.appendChild(a);}
    const k=el("button","","Kopier");k.type="button";k.onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);msg.className="msg ok";msg.textContent="Kopiert";}catch{ta.select();}};rad.appendChild(k);
    rad.appendChild(statusKnapp(m,"ferdig","Svart på annen måte",msg));rad.appendChild(statusKnapp(m,"ikke svar","Ikke svar",msg));
    rad.appendChild(msg);c.appendChild(rad);
  }else if(m.status==="ny"&&m.kategori==="bekreftelse"){const rad=el("div","row");rad.append(statusKnapp(m,"ferdig","Ferdig",msg),msg);c.appendChild(rad);}
  else if(m.status!=="ny"){const rad=el("div","row");rad.append(statusKnapp(m,"ny","Flytt til «Trenger svar»",msg),msg);c.appendChild(rad);}
  return c;
}
function statusKnapp(m,status,tekst,msg){const b=el("button","",tekst);b.type="button";b.onclick=async()=>{b.disabled=true;try{await api("/innboks/status",{id:m.id,status});m.status=status;if(status==="ny"&&m.kategori!=="bekreftelse")m.kategori="kunde";tegn();}catch(e){b.disabled=false;msg.className="msg err";msg.textContent=e.message;}};return b;}
document.querySelectorAll(".faner [data-f]").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;document.querySelectorAll(".faner [data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));tegn();});
$("oppdater").onclick=last;
if(!KUNDE||!R){$("liste").innerHTML='<div class="card err">Lenken mangler kode. Spør Preben om en ny.</div>';}else last();
</script></body></html>
